<title>KJEL Story Editor</title><style>
body{margin:0;background:#0A2A50;color:#0A2A50;font-family:Arial,Helvetica,sans-serif;font-size:15px}

.tag.keep{background:#FDB913;color:#0A2A50}.label{color:#D0101F;text-transform:uppercase}.nd .when{color:#0A2A50;font-size:13px}.ndn{color:#D0101F;font-weight:bold}.ndt{font-weight:normal}.card.concert{border-left:5px solid #D0101F}.tag.cong{background:#0A2A50;color:#FDB913}.tag.off{background:#D0101F;color:#FFFFFF}

.dsearch .dtab.on{background:#FDB913;border-color:#FDB913;color:#0A2A50}
.dhelp{color:#FFFFFF;font-size:15px;padding:6px 0 0}

.col.kjh,.card.kjh,.wxd.kjh{display:none}

.ctag.leb{background:#FDB913;color:#0A2A50}
.site{font-size:13px;margin-top:6px}.site a{font-weight:bold;color:#0A2A50}.nosite{color:#D0101F;font-weight:bold}
.dnote{color:#FFFFFF;font-size:16px;font-weight:bold;padding:6px 18px 0}
.dnote .dn{color:#FDB913}.dnote a{color:#FDB913}
.kjs .col{display:none}.kjs .col.kjm{display:inline-block}.kjs .card{display:none}.kjs .card.kjm{display:block}.kjs .search{display:none}
.wxw{border-left:6px solid #D0101F}.wxt{border-left:6px solid #FDB913}.wxi{border-left:6px solid #33445C}
.wxl{font-size:15px;font-weight:bold;margin:2px 0 6px}
.wxd{font-size:14px;margin:6px 0}.wxd .dl{font-weight:bold;color:#D0101F}
.wxok{font-size:13px;font-weight:bold;color:#33445C;padding:2px 4px 10px}
.wradd{display:block;width:100%;background:#D0101F;color:#FFFFFF;border:0;border-radius:8px;padding:9px;font-weight:bold;font-size:15px;cursor:pointer;margin-bottom:8px}
.wrt{white-space:pre-wrap;word-wrap:break-word}.wrh{font-weight:bold}.wrst{font-size:10px;color:#33445C;margin-right:4px}
.wwho{float:right;margin:1px 0 0 6px;white-space:nowrap}
.wwho b{display:inline-block;width:16px;height:16px;line-height:16px;text-align:center;font-size:11px;border:1px solid #8C97A8;border-radius:3px;color:#8C97A8;margin-left:2px;cursor:pointer}
.wwho b.on{background:#0A2A50;border-color:#0A2A50;color:#FDB913}
.wrtap{font-size:10px;color:#33445C;margin-top:3px;clear:both}
.wrmodal{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:9}
.wrwin{background:#FFFFFF;border-radius:10px;max-width:560px;margin:6% auto 0;padding:14px;color:#0A2A50}
.wrmt{font-weight:bold;font-size:18px;margin-bottom:8px}
.wrwin textarea{width:100%;box-sizing:border-box;height:240px;font-size:15px;font-family:Arial,Helvetica,sans-serif;padding:8px;border:1px solid #C9CFD8;border-radius:6px}
.wrerr{color:#D0101F;font-size:13px;font-weight:bold;min-height:16px;margin-top:4px}
.wrrow{text-align:right;margin-top:8px}
.wrrow button{font-size:14px;padding:6px 16px;border-radius:6px;border:1px solid #C9CFD8;background:#FFFFFF;color:#0A2A50;cursor:pointer;margin-left:8px}
.wrrow .wrgo{background:#D0101F;border-color:#D0101F;color:#FFFFFF;font-weight:bold}
.wrfull{float:right;font-size:11px;font-weight:bold;margin:2px 6px 0 0;padding:1px 8px;border:1px solid #8C97A8;border-radius:10px;color:#0A2A50;text-decoration:none}
.wrby{font-size:15px;font-weight:bold;margin:0 0 8px}.wrby label{margin-right:14px;cursor:pointer}
.wrlock{margin:0 0 8px}.wrlock input{font-size:14px;padding:6px;border:1px solid #C9CFD8;border-radius:6px;width:120px}
.wrlock button{font-size:14px;padding:6px 12px;border:0;border-radius:6px;background:#0A2A50;color:#FFFFFF;cursor:pointer}
.wrlink{font-size:10px;color:#33445C}.wrmore{font-size:12px;font-weight:bold;padding:2px 4px 8px}.wrmore a{color:#0A2A50}
.wrtool{padding:12px 18px 0}.wrtool .wradd{display:inline-block;width:auto;padding:9px 22px;margin:0 12px 0 0;vertical-align:middle}
.wrtool .wrlock{display:inline-block;margin:0 12px 0 0;vertical-align:middle}.wrtool .wrlock button{background:#FDB913;color:#0A2A50;font-weight:bold}.wrtool .empty{display:inline-block;color:#FFFFFF;font-size:14px;vertical-align:middle}
.wrfp .col{max-height:calc(100vh - 140px);overflow-y:auto}
.wrtool .edlink{background:#FDB913;color:#0A2A50;text-decoration:none}

.ed .col{max-height:calc(100vh - 110px);overflow-y:auto}
.ed .col.new{width:30%;min-width:320px}
.edwho{font-size:15px;font-weight:bold;margin:4px 0 8px}
.edwho button{font-size:18px;font-weight:bold;width:48px;height:40px;margin-left:8px;border:2px solid #0A2A50;border-radius:8px;background:#FFFFFF;color:#0A2A50;cursor:pointer}
.edwho button.on{background:#0A2A50;color:#FDB913}
.ed textarea{width:100%;box-sizing:border-box;height:220px;font-size:15px;font-family:Arial,Helvetica,sans-serif;padding:8px;border:1px solid #C9CFD8;border-radius:6px}
.edgo{display:block;width:100%;background:#D0101F;color:#FFFFFF;border:0;border-radius:8px;padding:11px;font-weight:bold;font-size:16px;cursor:pointer;margin:8px 0}
.edgo.busy{background:#8C97A8;cursor:default}
.edst{white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.4}
.edmeta{font-size:11px;color:#33445C;margin-bottom:4px}
.edmeta b{display:inline-block;background:#0A2A50;color:#FDB913;border-radius:3px;padding:0 5px;margin-right:4px}
.edsec{font-weight:bold;color:#0A2A50}.edsec.short{color:#D0101F}
.edbtn{margin-top:6px}.edbtn button{font-size:13px;font-weight:bold;padding:5px 12px;margin:0 6px 0 0;border-radius:6px;border:1px solid #0A2A50;background:#FFFFFF;color:#0A2A50;cursor:pointer}
.edbtn button.cp{background:#FDB913;border-color:#FDB913}
.edbtn button.busy{color:#8C97A8;border-color:#8C97A8;cursor:default}
.card.blk{background:#F3E1E1;border-color:#D0101F}.blkr{font-weight:bold;color:#D0101F;font-size:13px}.blks{font-size:12px;color:#33445C;margin-top:3px}
.ederr{color:#D0101F;font-size:13px;font-weight:bold;min-height:16px}
.edwait{font-weight:bold;color:#0A2A50;background:#FFF1C2;border-radius:4px;padding:4px 6px;margin:2px 0 4px}
.edres .card{border:2px solid #FDB913}
</style></head>
<body class="ed" data-updated="1793707446000">
<div class="top"><div class="logo">103<span class="star">&#9733;</span>7 <span class="call">KJEL</span></div>
<div class="hd"><div class="title">Story Editor</div>
<div class="meta">KJEL News &middot; paste a story, tap J or R, then Condense story</div></div></div>
<div class="board"><div class="col new"><h2>New story</h2><div class="edwho" id="edwho">Who is editing? <button type="button">J</button><button type="button">R</button></div><textarea id="edtext" placeholder="Paste the story here"></textarea><button type="button" class="edgo" id="edgo">Condense story</button><div class="ederr" id="ederr"></div><div class="edres" id="edres"></div></div><div id="eddays" style="display:inline"></div></div>
<script>
(function(){
  var URL="https://script.google.com/macros/s/AKfycbwIlo1rheA9RjkqkBCxsQCPz1OYipWf-7Fw6W9wFdTzp9MujAS9S2enTn2e7iTbg8ZdXw/exec", DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var who='', busy=false, err=document.getElementById('ederr'), ta=document.getElementById('edtext');
  var go=document.getElementById('edgo'), res=document.getElementById('edres'), days=document.getElementById('eddays');
  var wb=document.getElementById('edwho').getElementsByTagName('button'), n;
  function getKey(){try{return window.localStorage.getItem('wrkey')||'';}catch(e){return '';}}
  function call(body,cb){
    var x=new XMLHttpRequest();
    x.open('POST',URL,true);
    x.setRequestHeader('Content-Type','text/plain;charset=utf-8');  // keeps the request "simple", so no CORS preflight
    x.onreadystatechange=function(){
      if(x.readyState!==4) return;
      var d=null; try{d=JSON.parse(x.responseText);}catch(e){}
      if(d && d.ok && !d.edited) d={ok:false,error:'The Story Editor is not switched on yet: the WireReady Google script needs its update.'};  // old script deployed
      cb(d);
    };
    body.key=getKey();
    x.send(JSON.stringify(body));
  }
  function pickWho(b){return function(){who=b.innerHTML; for(var k=0;k<wb.length;k++) wb[k].className=(wb[k]===b?'on':''); err.innerHTML='';};}
  for(n=0;n<wb.length;n++) wb[n].onclick=pickWho(wb[n]);
  function el(tag,cls,txt){var e=document.createElement(tag); if(cls) e.className=cls; if(txt!==undefined) e.appendChild(document.createTextNode(txt)); return e;}
  function copy(text,btn){
    var t=document.createElement('textarea'); t.value=text; t.style.position='fixed'; t.style.left='-9999px';
    document.body.appendChild(t); t.select(); var ok=false; try{ok=document.execCommand('copy');}catch(e){}
    document.body.removeChild(t);
    btn.innerHTML=ok?'Copied':'Select and copy by hand'; setTimeout(function(){btn.innerHTML='Copy';},2000);
  }
  function hm(s){var h=parseInt(s.slice(11,13),10), m=s.slice(14,16); return (h%12||12)+':'+m+(h<12?' AM':' PM');}
  function card(s){
    var c=el('div','card'+(s.status==='blocked'?' blk':'')), meta=el('div','edmeta');
    var b=el('b','',s.by); meta.appendChild(b); meta.appendChild(document.createTextNode(hm(s.added)+' · '));
    if(s.status==='queued' || s.status==='more'){
      meta.appendChild(document.createTextNode(s.status==='more'?'adding detail':'in line')); c.appendChild(meta);
      c.appendChild(el('div','edwait',s.status==='more'?'Adding more detail... usually 1 to 2 minutes.':'Condensing... usually 1 to 2 minutes.'));
      if(s.story) c.appendChild(el('div','edst',s.story));
      else c.appendChild(el('div','blks',s.source.length>160?s.source.slice(0,160)+'...':s.source));
      return c;
    }
    if(s.status==='blocked'){
      meta.appendChild(document.createTextNode('not for air')); c.appendChild(meta);
      c.appendChild(el('div','blkr','BLOCKED: '+s.reason));
      c.appendChild(el('div','blks',s.source.length>160?s.source.slice(0,160)+'...':s.source));
      return c;
    }
    var sec=el('span','edsec'+(s.secs<20?' short':''),s.secs+' sec'+(s.secs<20?' · SHORT':''));
    meta.appendChild(sec); c.appendChild(meta);
    c.appendChild(el('div','edst',s.story));
    var row=el('div','edbtn'), cp=el('button','cp','Copy'), more=el('button','','Add more detail');
    cp.onclick=function(){copy(s.story,cp);};
    if(s.secs>=45) more.style.display='none';
    more.onclick=function(){
      if(busy) return; busy=true; more.className='busy'; more.innerHTML='Adding detail...';
      call({action:'more',id:s.id},function(d){
        busy=false;
        if(d && d.ok){render(d.edited, res.getAttribute('data-id')===s.id?s.id:'', d.workerAgo);}
        else{more.className=''; more.innerHTML='Add more detail'; alert((d && d.error) || 'Could not reach the Story Editor. Try again.');}
      });
    };
    row.appendChild(cp); row.appendChild(more); c.appendChild(row);
    return c;
  }
  function ymd(d){function p(v){return (v<10?'0':'')+v;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());}
  var waitTimer=null;
  function render(list,showId,workerAgo){
    var k, j, waiting=false;
    for(j=0;j<list.length;j++){ if(list[j].status==='queued' || list[j].status==='more') waiting=true; }
    // While a story waits for the Mac, check every 15 seconds; say so if the Mac has not asked for work in 3 minutes.
    if(waitTimer){clearTimeout(waitTimer); waitTimer=null;}
    if(waiting) waitTimer=setTimeout(refresh,15000);
    err.innerHTML=(waiting && (workerAgo<0 || workerAgo>180))?'The news Mac is not answering, so stories are waiting in line. They will finish when it is back on.':'';
    res.innerHTML=''; res.setAttribute('data-id',showId||'');
    for(j=0;j<list.length;j++){ if(showId && list[j].id===showId) res.appendChild(card(list[j])); }
    days.innerHTML='';
    var t=new Date();
    for(k=0;k<7;k++){  // today first, then the 6 days before it
      var d=new Date(t.getFullYear(),t.getMonth(),t.getDate()-k), key=ymd(d), items=[];
      for(j=0;j<list.length;j++){ if(list[j].added.slice(0,10)===key) items.push(list[j]); }
      var col=el('div','col'), h=el('h2','',DAYS[d.getDay()]+"'s Stories "), cnt=el('span','count',String(items.length));
      h.appendChild(cnt); col.appendChild(h);
      col.appendChild(el('div','sub',MON[d.getMonth()]+' '+d.getDate()+(k===0?' · today':'')));
      for(j=0;j<items.length;j++) col.appendChild(card(items[j]));
      if(!items.length) col.appendChild(el('div','empty','No stories.'));
      days.appendChild(col);
    }
  }
  function refresh(){
    if(busy) return;
    call({action:'edited'},function(d){
      if(d && d.ok) render(d.edited, res.getAttribute('data-id'), d.workerAgo);
      else if(!busy) err.innerHTML=(d && d.error==='passcode')?'Open WireReady once and enter the passcode, then come back.':(d && d.error) || 'Could not load saved stories. It will try again in a minute.';
    });
  }
  ta.onkeyup=function(){err.innerHTML='';};
  go.onclick=function(){
    var v=ta.value.replace(/^\s+|\s+$/g,'');
    if(!who){err.innerHTML='Tap J or R first.';return;}
    if(!v){err.innerHTML='Paste the story first.';return;}
    if(busy) return;
    busy=true; go.className='edgo busy'; go.innerHTML='Sending...'; err.innerHTML='';
    call({action:'condense',text:v,by:who},function(d){
      busy=false; go.className='edgo'; go.innerHTML='Condense story';
      if(d && d.ok){ta.value=''; render(d.edited,d.id,d.workerAgo);}
      else err.innerHTML=(d && d.error) || 'Could not reach the Story Editor. Check the connection and try again.';
    });
  };
  refresh(); setInterval(refresh,60000);
})();
</script>
